[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dadri"
version = "0.1.0"
description = "Continuous, normalized social media intelligence ingestion"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "motor>=3.6,<4",
]

[project.optional-dependencies]
x = ["twscrape>=0.20,<1"]
telegram = ["telethon>=1.36,<2"]
language = ["langdetect>=1.0.9,<2"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
# Phase 2 NLP/graph scoring. torch and scipy are not imported directly but are
# required at runtime: transformers needs a backend, and networkx.pagerank needs scipy.
processing = [
    "pymongo>=4.18,<5",
    "python-dotenv>=1.2,<2",
    "spacy>=3.7,<3.8",
    "networkx>=3.6,<4",
    "scipy>=1.17,<2",
    "transformers>=5.16,<6",
    "torch>=2.14,<3",
]
# Everything the web console needs, including live polling and on-demand analysis.
all = [
    "dadri[x,telegram,language,web,processing]",
]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["dadri"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
