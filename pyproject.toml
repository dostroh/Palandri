[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dadri"
version = "0.1.0"
description = "Continuous, normalized social media intelligence ingestion"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "motor>=3.6,<4",
]

[project.optional-dependencies]
x = ["twscrape>=0.20,<1"]
telegram = ["telethon>=1.36,<2"]
language = ["langdetect>=1.0.9,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["dadri"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
